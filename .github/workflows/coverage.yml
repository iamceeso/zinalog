name: Coverage badge

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:
    branches: ["main"]

jobs:
  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage 2>&1 | tee coverage-report.txt

      - name: Generate coverage badge
        run: node .github/scripts/update-coverage-badge.mjs coverage-report.txt .github/badges/coverage.svg

      - name: Commit updated coverage badge
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "Coverage badge is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git push
